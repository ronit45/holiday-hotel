name: Test Suite
on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd hotel-booking-backend && npm ci
      - run: cd hotel-booking-backend && npm run build
      - run: cd hotel-booking-backend && npm test -- --coverage

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd hotel-booking-frontend && npm ci
      - run: cd hotel-booking-frontend && npm run build
      - run: cd hotel-booking-frontend && npx vitest run --coverage

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd e2e-tests && npm ci
      - run: npx playwright install --with-deps
      - run: cd e2e-tests && npx playwright test
